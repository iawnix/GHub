name: Signed APK release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  verify:
    uses: ./.github/workflows/check.yml
    with:
      allow_device_failures: true
  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Check release version
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build signed release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
        run: |
          umask 077
          test -n "$KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE"
          ./gradlew :codex-client:test :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk'
      - name: Publish APK and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ghub.apk
          git archive --format=tar.gz --prefix="ghub-${GITHUB_REF_NAME#v}/" --output=ghub-source.tar.gz HEAD
          sha256sum ghub.apk ghub-source.tar.gz > SHA256SUMS
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" ghub.apk SHA256SUMS ghub-source.tar.gz --verify-tag --draft --title "GHub $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" ghub.apk SHA256SUMS ghub-source.tar.gz --verify-tag --draft --title "GHub $GITHUB_REF_NAME" --generate-notes
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification-reports
          path: |
            codex-client/build/reports/tests/
            app/build/reports/
            app/build/outputs/mapping/release/
      - name: Remove signing material
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"
